<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05070F" />
    <meta
      name="description"
      content="万圣夜糖果雨：左右移动篮子接住更多糖果，避开炸弹。手绘风万圣夜接糖果小游戏。"
    />
    <title>万圣夜糖果雨</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='34' r='24' fill='%23E95620'/%3E%3Cpath d='M26 18c0-6 4-10 6-10s6 4 6 10' fill='none' stroke='%235B2A0E' stroke-width='4'/%3E%3Cpath d='M20 30l7 6-7 5zM44 30l-7 6 7 5zM24 44c5 5 11 5 16 0' fill='%23000'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/styles/base.css" />
  </head>
  <body>
    <div id="app">
      <section id="start-screen" class="screen screen--start" aria-label="开始屏幕"></section>

      <section id="game-screen" class="screen screen--game" hidden>
        <div id="stage" class="stage">
          <canvas
            id="game-canvas"
            class="game-canvas"
            width="960"
            height="600"
            role="img"
            aria-label="万圣夜糖果雨游戏画面"
          ></canvas>
          <div id="hud" class="hud" aria-live="polite"></div>
        </div>
      </section>

      <div id="game-over-layer" class="modal-layer" hidden></div>
    </div>

    <noscript>
      <p class="noscript-note">需要启用 JavaScript 才能玩「万圣夜糖果雨」。</p>
    </noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
